name: Update Changelog

on:
  push:
    tags:
      - 'v*' # Запускать только при пуше тегов, начинающихся с v (например, v1.0.0)

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает права на коммит изменений в репозиторий

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Критически важно! git-cliff нужна вся история коммитов

      - name: Install Rust and git-cliff
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install git-cliff

      - name: Generate Changelog
        run: |
          # Запускаем git-cliff с нашим конфигом и сохраняем в CHANGELOG.md
          git-cliff --config cliff.toml --verbose -o CHANGELOG.md

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          file_pattern: CHANGELOG.md