name: Release Process

on:
  push:
    tags:
      - 'v*'

jobs:
  # ДЖОБА 1: Обновляем CHANGELOG
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install Rust and git-cliff
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install git-cliff

      - name: Generate Changelog
        run: |
          git-cliff --config cliff.toml --verbose -o CHANGELOG.md

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md for ${{ github.ref_name }}"
          file_pattern: CHANGELOG.md
          branch: main

  # ДЖОБА 2: Собираем и делаем релиз
  build-and-release:
    needs: update-changelog
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # <--- ИЗМЕНЕНО НА 9.0.x

      - name: Publish Project
        # Сборка в один файл с извлечением нативных библиотек
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Zip Artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath ./galinaBot_${{ github.ref_name }}.zip

      - name: Extract Changelog Section
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          awk -v ver="${VERSION#v}" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: ./galinaBot_${{ github.ref_name }}.zip